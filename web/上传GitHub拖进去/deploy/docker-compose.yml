# 国内轻量云服务器 / 任意 VPS 一键起服务
#
# 用法（在仓库根目录执行）：
#   docker compose -f deploy/docker-compose.yml up -d --build
#   然后浏览器打开 http://服务器IP/ 即可（页面和接口同源，不需要额外配置）
#
# 想换端口：PORT=8000 docker compose -f deploy/docker-compose.yml up -d
# 国内构建慢：PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple docker compose ... up -d --build

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    image: douban-mini:latest
    container_name: douban-mini
    restart: unless-stopped
    # 对外端口 : 容器内端口；默认用 80，浏览器地址栏不用带端口号
    ports:
      - "${PORT:-80}:8000"
    environment:
      # 云端模式：登录凭证只存访问者自己的浏览器，多人共用也不串号
      DOUBAN_CLOUD: "1"
      DOUBAN_DATA_DIR: "/data"
      TZ: "Asia/Shanghai"
    volumes:
      # 补充记录 / 设备号持久化，删容器重建也不丢
      - app-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---- 可选：已有「已备案域名」时用它自动上 HTTPS ----
  # 启动：DOMAIN=your.domain docker compose -f deploy/docker-compose.yml --profile https up -d
  # 注意：国内服务器 80/443 绑域名访问要求域名已 ICP 备案，未备案会被云厂商拦截
  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    container_name: douban-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  app-data:
  caddy-data:
  caddy-config:
