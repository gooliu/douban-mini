# 把 web/ 静态前端自动部署到 GitHub Pages
#
# 首次 push 后会自动开启 Pages（configure-pages 的 enablement），
# 无需再手动去 Settings → Pages → Source 选 "GitHub Actions"。
#
# 可选：在 Settings → Secrets and variables → Actions → Variables 里
# 加一个 CLOUD_API = https://你的服务.onrender.com
# 工作流会自动把它写进前端；不设则沿用代码里的地址。
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 注入云端后端地址（可选）
        run: |
          if [ -n "${{ vars.CLOUD_API }}" ]; then
            sed -i -E "s|const DEFAULT_CLOUD_API = '[^']*';|const DEFAULT_CLOUD_API = '${{ vars.CLOUD_API }}';|" web/index.html
            echo "已注入后端地址: ${{ vars.CLOUD_API }}"
            grep -n "DEFAULT_CLOUD_API =" web/index.html | head -1
          else
            echo "未设置 CLOUD_API，沿用代码里的 DEFAULT_CLOUD_API"
            grep -n "DEFAULT_CLOUD_API =" web/index.html | head -1
          fi

      - name: 确认入口文件存在
        run: |
          test -f web/index.html || { echo "找不到 web/index.html"; exit 1; }
          ls -la web/

      - uses: actions/configure-pages@v5
        with:
          # 自动把仓库的 Pages 源设为 GitHub Actions（首次运行即生效）
          enablement: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4