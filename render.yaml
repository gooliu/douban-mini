# Render Blueprint：push 到 GitHub 后在 Render 里 "New > Blueprint" 选本仓库即可一键部署
# 免费套餐注意：15 分钟无访问会休眠，下次打开要等约 30~60 秒唤醒（页面会提示"正在唤醒"）
#
# ⚠️ 2026-10 实测：部分新账号建免费 Web 服务时会弹 "Add card"，要求绑卡做 1 美元
# 预授权（验证用，不实际扣费）。不想绑卡请改用 Zeabur（见 README「云端部署」方式一）。
services:
  - type: web
    name: douban-mini
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore          # 新加坡，离中国大陆更近
    healthCheckPath: /api/health
    envVars:
      - key: DOUBAN_CLOUD
        value: "1"             # 云端模式：登录凭证只存访问者浏览器，不落服务端
      - key: DOUBAN_DATA_DIR
        value: "/data"         # 补充记录目录；免费套餐无持久卷，重新部署会清空
      - key: DOUBAN_CACHE_TTL
        value: "300"
      - key: DOUBAN_SELF_UID
        sync: false            # 可选：填你自己的 uid
